plugins {
    id 'org.quiltmc.loom' version '1.5.+'
    id 'maven-publish'
}

group = 'de.maxhenkel.voicechat'
archivesBaseName = 'voicechat'
version = '1.0.0'

dependencies {
    // Quilt Loader + QFAPI
    modImplementation "org.quiltmc:quilt-loader:0.28.1"
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:11.0.0-alpha.3+0.102.0-1.21"

    // Config/GUI
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    implementation "me.shedaniel.configbuilder:config-builder:${configbuilder_version}"

    // Audio libs
    implementation "com.sedmelluq:concentus:${concentus_version}"
    implementation "com.discord4j:opus4j:${opus4j_version}"
    implementation "com.rnnoise4j:rnnoise4j:${rnnoise4j_version}"
    implementation "com.lame4j:lame4j:${lame4j_version}"
}

repositories {
    mavenCentral()
    maven { url "https://maven.quiltmc.org/repository/release/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://jitpack.io" }
}

loom {
    accessWidenerPath = file("src/main/resources/voicechat.accesswidener")
}

tasks.register("uploadMod") {
    group = "publishing"
    doLast {
        println "Quilt mod built successfully. Add publishing logic here if needed."
    }
}

java {
    withSourcesJar()
    toolchain.languageVersion.set(JavaLanguageVersion.of(17)) // Or use 21 if needed
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
